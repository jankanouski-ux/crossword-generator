<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сканворд — играть</title>
    <meta name="description" content="Решайте сканворд: игровое поле, задания и клавиатура.">
    <meta name="theme-color" content="#fffbea">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<input type="checkbox" id="menu-toggle" class="sr-only">

<div class="page">
    <div class="gingham" aria-hidden="true"></div>

    <header class="site-header">
        <div class="site-header__row">
            <label for="menu-toggle" class="icon-button" aria-label="Открыть меню" role="button" tabindex="0">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </label>
            <h1 class="title" aria-label="Сканворды"><span class="cells" aria-hidden="true"><span class="cell" style="--tilt:-5deg;--lift:0px"><span class="cell__num">1</span>С</span><span class="cell" style="--tilt:3deg;--lift:1px">К</span><span class="cell" style="--tilt:-2deg;--lift:-1px"><span class="cell__num">2</span>А</span><span class="cell" style="--tilt:5deg;--lift:1px">Н</span><span class="cell cell--accent" style="--tilt:-3deg;--lift:0px">В</span><span class="cell" style="--tilt:2deg;--lift:-1px"><span class="cell__num">3</span>О</span><span class="cell" style="--tilt:-5deg;--lift:1px">Р</span><span class="cell" style="--tilt:4deg;--lift:0px"><span class="cell__num">4</span>Д</span><span class="cell" style="--tilt:-2deg;--lift:-1px">Ы</span></span></h1>
            <span aria-hidden="true"></span>
        </div>
    </header>

    <label for="menu-toggle" class="drawer-overlay" aria-hidden="true"></label>
    <aside class="drawer" aria-label="Меню">
        <div class="drawer__head">
            <span class="cells cells--small" aria-hidden="true"><span class="cell" style="--tilt:-5deg;--lift:0px"><span class="cell__num">1</span>С</span><span class="cell" style="--tilt:3deg;--lift:1px">К</span><span class="cell" style="--tilt:-2deg;--lift:-1px"><span class="cell__num">2</span>А</span><span class="cell" style="--tilt:5deg;--lift:1px">Н</span><span class="cell cell--accent" style="--tilt:-3deg;--lift:0px">В</span><span class="cell" style="--tilt:2deg;--lift:-1px"><span class="cell__num">3</span>О</span><span class="cell" style="--tilt:-5deg;--lift:1px">Р</span><span class="cell" style="--tilt:4deg;--lift:0px"><span class="cell__num">4</span>Д</span><span class="cell" style="--tilt:-2deg;--lift:-1px">Ы</span></span>
            <p>Генератор сканвордов</p>
            <label for="menu-toggle" class="drawer__close" aria-label="Закрыть меню" role="button" tabindex="0">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </label>
        </div>
        <nav class="drawer__nav" aria-label="Основное меню">
            <a class="menu-item" href="/">Новый сканворд</a>
            <span class="menu-item is-active" aria-current="page">Текущий сканворд</span>
            <span class="menu-item is-disabled">Мои сканворды <em>скоро</em></span>
            <span class="menu-item is-disabled">Как решать <em>скоро</em></span>
            <span class="menu-item is-disabled">Настройки <em>скоро</em></span>
        </nav>
    </aside>

    <main class="play">

        <div class="board" id="board" role="grid" aria-label="Игровое поле"
             th:style="'grid-template-columns: repeat(' + ${puzzle.size} + ', 1fr);
                grid-template-rows: repeat(' + ${puzzle.size} + ', 1fr)'">
            <th:block th:each="row : ${grid}">
                <div class="board__cell"
                     th:each="cell : ${row}"
                     th:classappend="${cell.cssClass()}"
                     th:attr="data-letter=${cell.letter}">
      <span class="board__clue"
            th:if="${cell.entry != null}"
            th:text="${cell.entry.clue} + ' ' + ${cell.entry.arrow()}"></span>
                </div>
            </th:block>
        </div>

        <section class="clue" aria-label="Текущее задание">
            <button type="button" class="arrow" id="prev" aria-label="Предыдущее задание">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="clue__box" aria-live="polite">
                <span class="clue__count" id="clue-count"></span>
                <p class="clue__text" id="clue-text"></p>
            </div>
            <button type="button" class="arrow" id="next" aria-label="Следующее задание">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </section>

        <div class="answer" id="answer" role="group" aria-label="Ответ"></div>

        <div class="keyboard" role="group" aria-label="Клавиатура">
            <div class="keyboard__row">
                <button type="button" class="key" data-key="Й">Й</button>
                <button type="button" class="key" data-key="Ц">Ц</button>
                <button type="button" class="key" data-key="У">У</button>
                <button type="button" class="key" data-key="К">К</button>
                <button type="button" class="key" data-key="Е">Е</button>
                <button type="button" class="key" data-key="Н">Н</button>
                <button type="button" class="key" data-key="Г">Г</button>
                <button type="button" class="key" data-key="Ш">Ш</button>
                <button type="button" class="key" data-key="Щ">Щ</button>
                <button type="button" class="key" data-key="З">З</button>
                <button type="button" class="key" data-key="Х">Х</button>
                <button type="button" class="key" data-key="Ъ">Ъ</button>
            </div>
            <div class="keyboard__row">
                <button type="button" class="key" data-key="Ф">Ф</button>
                <button type="button" class="key" data-key="Ы">Ы</button>
                <button type="button" class="key" data-key="В">В</button>
                <button type="button" class="key" data-key="А">А</button>
                <button type="button" class="key" data-key="П">П</button>
                <button type="button" class="key" data-key="Р">Р</button>
                <button type="button" class="key" data-key="О">О</button>
                <button type="button" class="key" data-key="Л">Л</button>
                <button type="button" class="key" data-key="Д">Д</button>
                <button type="button" class="key" data-key="Ж">Ж</button>
                <button type="button" class="key" data-key="Э">Э</button>
            </div>
            <div class="keyboard__row">
                <button type="button" class="key" data-key="Я">Я</button>
                <button type="button" class="key" data-key="Ч">Ч</button>
                <button type="button" class="key" data-key="С">С</button>
                <button type="button" class="key" data-key="М">М</button>
                <button type="button" class="key" data-key="И">И</button>
                <button type="button" class="key" data-key="Т">Т</button>
                <button type="button" class="key" data-key="Ь">Ь</button>
                <button type="button" class="key" data-key="Б">Б</button>
                <button type="button" class="key" data-key="Ю">Ю</button>
                <button type="button" class="key key--erase" data-erase aria-label="Стереть букву"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="m18 9-6 6M12 9l6 6"/></svg></button>
            </div>
        </div>
    </main>
</div>

<!-- <script src="play.js"></script> -->
</body>
</html>
